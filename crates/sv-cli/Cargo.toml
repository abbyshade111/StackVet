[package]
name = "sv-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "sv"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
sv-frameworks = { path = "../sv-frameworks" }
sv-manifest = { path = "../sv-manifest" }
sv-report = { path = "../sv-report" }
sv-scan = { path = "../sv-scan" }
sv-run = { path = "../sv-run" }
sv-check = { path = "../sv-check" }
toml_edit = "0.25"
# To read a passphrase without showing it (ADR-043); already a dependency of sv-run.
libc = "0.2"
# A typed passphrase is zeroed once used (ADR-043); already a dependency of sv-check.
zeroize = "1"
# Unpacks a public project's archive (backlog 0670, ADR-154): reading only, pure Rust (zlib-rs), no compressor.
zip = { version = "9.1.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
# For the tests alone, never in `sv` itself: holds what the OSCAL export writes to NIST's own JSON schema, offline
# (ADR-156). Built on the `regex` crate the schema's patterns need; it adds 43 crates to the lock file, most of them the
# Unicode tables URL parsing needs (`url`, `idna`), none to what `sv` is built from.
boon = "=0.6.1"
