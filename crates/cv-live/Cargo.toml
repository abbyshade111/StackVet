[package]
name = "cv-live"
version.workspace = true
edition.workspace = true
license.workspace = true

# ConfigVet's live clients (ADR-157, decisions 4 and 5; backlog 0717): the only code in this project that reads a hosting
# account. `sv-cli` must never depend on it, directly or through another crate; `crates/sv-cli/tests/cv_live_fence.rs`
# fails if it does. Requests go through `curl`, run with fixed flags, so this adds no HTTP library.
[dependencies]
serde.workspace = true
serde_json.workspace = true
cv-rules = { path = "../cv-rules" }
sv-core = { path = "../sv-core" }
