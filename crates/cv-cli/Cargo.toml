[package]
name = "cv-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

# The `cv` binary (ADR-157, decision 1; backlog 0687). It depends on no crate of `sv`'s checks, runner, or report.
[[bin]]
name = "cv"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
cv-rules = { path = "../cv-rules" }
sv-core = { path = "../sv-core" }
# The runner of `sv`'s outside tools, used as it is (the owner's choice, 21 November 2026; ADR-157, Later). It brings
# all of `sv`'s checks with it; ADR-157 decision 1 already plans for `cv` to run `sv`'s `config.*` checks.
sv-check = { path = "../sv-check" }
# The live clients (ADR-157, decision 4; backlog 0717): `cv live <provider>` only. `sv-cli` never reaches this crate.
cv-live = { path = "../cv-live" }
sv-frameworks = { path = "../sv-frameworks" }
sv-scan = { path = "../sv-scan" }
