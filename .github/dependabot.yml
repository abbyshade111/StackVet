# Keeps the workflow steps, the Rust packages, and the container's base images up to date. (v1's npm packages were watched here until v1 moved to its
# own branch; the Rust packages were not watched until 26 September 2026.)
# The workflow steps are pinned to commit fingerprints; these updates move the fingerprint and the version comment
# together, so pinning never means falling behind on security fixes.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Wait before proposing a newly published version: a compromised release is usually found within days. Security
    # fixes still arrive as their own pull requests. Dependabot refuses `semver-major-days` here and for the base images
    # below (found on 27 September 2026, when it first checked this file); the Rust packages keep it.
    cooldown:
      default-days: 7
    # CodeQL's `init` and `analyze` steps have to be the same version, and as separate pull requests each one moved
    # one step and failed (#468 and #469, 3 October 2026). Grouped, they arrive together.
    groups:
      codeql-action:
        patterns: ['github/codeql-action*']

  # The Rust packages `sv` is built from (Cargo.lock), and the fuzz crate's lock, which must keep the workspace's
  # versions (ADR-077; crates/sv-cli/tests/fuzz_lock.rs): it is a crate of its own, so it is named here beside the root
  # and the group below proposes both in one pull request (backlog 0617; ADR-128). Until 20 October 2026 a session
  # moved the fuzz lock by hand after each bump (#1628).
  - package-ecosystem: cargo
    directories: ['/', '/fuzz']
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Wait before proposing a newly published version: a compromised release is usually found within days. Security
    # fixes still arrive as their own pull requests.
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      all-packages:
        patterns: ['*']
        # One pull request for an update across both directories, rather than one per directory.
        group-by: dependency-name

  # The two base images in the Dockerfile (the Rust toolchain that builds `sv`, and the Debian it runs on), pinned
  # there to a fingerprint, which is what this moves: their names carry no version to bump. A new base image is how
  # security fixes to the system underneath `sv` reach the published container; CI builds and drives the image on
  # every pull request, so a proposed update is tested before it can be merged.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7

  # The helper images `sv run` starts beside the app (the probes, the mail server, the test provider, and the browser),
  # pinned by fingerprint in crates/sv-run/images/Dockerfile, which the code reads when it is compiled (backlog 0317).
  # A new fingerprint, or a new tag, changes what every `sv run` starts, so the whole suite runs against it first.
  - package-ecosystem: docker
    directory: /crates/sv-run/images
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    # Node's major version is the owner's choice, made from Node's release schedule: only the even-numbered majors get
    # long-term support, and Dependabot proposes whichever major is newest (#1634 offered Node 25, unsupported since
    # 1 June 2026). Fixes within the chosen major still arrive here as new fingerprints (ADR-019, Later, 13 October 2026).
    # Dependabot has named it both ways: `node` in #1634, `library/node` in #2139, which the first name alone let
    # through (backlog 0617).
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
      - dependency-name: library/node
        update-types: ['version-update:semver-major']

  # py7zr, which only the CI steps that run the archive tests install (ADR-089), and each package it pulls in, pinned
  # with their files' hashes in tools/py7zr-requirements.txt (backlog 0288). Each update moves a version and its hashes
  # together; the suite on Linux and the Windows workflow both run on a pull request that changes the file.
  - package-ecosystem: pip
    directory: /tools
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      py7zr:
        patterns: ['*']
