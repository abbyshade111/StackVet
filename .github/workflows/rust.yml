# The Rust checks for `sv`, which is what this repository is. (Until 26 September 2026 the repository held SecureVibe v1
# at its top and `sv` under `agnostic/`; v1 now lives on the `v1` branch and at the tags `v1-paper` and `v1-final`.)
#
# It runs on every push and pull request: the tests read `data/`, `docs/` and `examples/` as well as the crates, and a
# change to any of them can break a guard, so nothing is filtered out by path, with one exception: a pull request
# that changes only backlog items runs only the tests that read them, under the same required `test` check (ADR-104). `sv` reads the OWASP data in `data/`,
# and its suite asserts things about it: that exactly two `never` rules survive the overlay, that the set of
# conditions no rule keys on is the one we think, and that every condition named in the data files exists in the
# Rust enum.
#
# Every step is pinned to an exact commit fingerprint rather than a version name: a version name can be moved to
# point at different code, a fingerprint cannot.

name: Rust

on:
  push:
    # Every commit on main (ADR-051). A commit on any other branch is tested by its pull request's
    # run, which is the one branch protection reads; until 8 October 2026 every push to a branch
    # also ran here, so each pull-request commit ran the 15-minute test job twice (BACKLOG, "From the
    # architecture assessment of 8 October 2026", item 1).
    branches: [main]
  pull_request:
  schedule:
    # Every night on main, whether or not anything was pushed (ADR-051, Later, 8 October 2026): the
    # toolchain step takes the newest stable, the runner image moves, and OSV and Docker Hub change
    # under the image job, so a quiet day can still break the build, and this says so by morning
    # rather than at somebody's next pull request. The publish job below runs only for a push.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Every commit on main is tested (ADR-051): there the group is the commit, so no run waits behind
# another. With one group for all of main, GitHub kept only the newest waiting run and canceled the
# rest, whatever cancel-in-progress said: 19 of 50 runs on main on 7 October 2026 never finished. On
# any other branch a newer push still cancels a run still going, since only a pull request's newest
# commit can be merged. Publishing has a group of its own below.
concurrency:
  group: rust-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Every build in CI starts from nothing, so Cargo's incremental cache is written and never read, and
# incremental mode splits the workspace crates into more pieces to compile (backlog 0356). Measured
# on 13 October 2026, a clean `cargo test --workspace --no-run` on 4 cores, one run each: 156 s with
# it, 137 s without. Local builds keep it.
env:
  CARGO_INCREMENTAL: "0"

jobs:
  # The checks before a pull request merges, as four jobs (backlog 0192 part 1, ADR-106). Until 12 October
  # 2026 one job ran formatting, lints, and the whole suite, one test program after another, in about
  # eighteen minutes. Now `scope` decides between the short path of ADR-104 and the whole suite;
  # `lints` and the three `suite` jobs run side by side; and `test`, the check `main` requires, waits for
  # them all and fails when any did, so the required check still covers everything it did.
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Two commits deep, so the step below can compare a pull request's merge commit with its first
        # parent, the `main` it merges into. The token stays out of the checked-out folder (AC.12.2).
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: What the pull request changes
        # A pull request that changes only backlog items takes the short path in `test` below: the
        # tests that read those files, and no others (ADR-104). Anything else, and every push or
        # nightly run on main, takes the whole suite. Every later job asks `!= 'false'`, so a missing
        # or misspelled answer runs everything rather than nothing.
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          full=true
          if [ "$EVENT" = pull_request ]; then
            git diff --no-renames --name-only HEAD^1 HEAD | tee "$RUNNER_TEMP/changed.txt"
            full=$(python3 tools/ci_scope.py < "$RUNNER_TEMP/changed.txt") || full=true
          fi
          [ "$full" = false ] || full=true
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "The whole suite runs: $full"

  lints:
    needs: scope
    if: needs.scope.outputs.full != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The token stays out of the checked-out folder, so nothing that runs later in the job
        # (a build script, a test, a package from outside) can read it. `sv check` reports this (AC.12.2).
        with:
          persist-credentials: false

      - name: Use the toolchain this workspace needs
        # edition 2024 and resolver 3 need a recent stable; the runner image ships one, but saying so explicitly
        # means a runner image change fails here with a clear reason rather than a syntax error in a crate.
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable


      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --all-targets -- -D warnings

  suite:
    needs: scope
    if: needs.scope.outputs.full != 'false'
    runs-on: ubuntu-latest
    # The whole suite took 14 to 15 minutes in one job by 5 October 2026; each part runs a share of it.
    timeout-minutes: 30
    strategy:
      # Each part runs to its end even when another fails, so one run shows every failure.
      fail-fast: false
      matrix:
        # `check`: sv-check alone, its 1,500 unit tests and 40 test files, which made `rest` the longest
        # part (backlog 0350). `rest`: every other crate but sv-cli, and sv-cli's own unit tests. `cli-1`
        # and `cli-2`: sv-cli's test files, dealt between them by tools/ci_shards.py, which a test holds to
        # every file exactly once.
        part: [rest, check, cli-1, cli-2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The token stays out of the checked-out folder, so nothing that runs later in the job
        # (a build script, a test, a package from outside) can read it. `sv check` reports this (AC.12.2).
        with:
          persist-credentials: false

      - name: Fetch Docker Hub's images through Google's mirror
        # Docker Hub refuses downloads past its limits, and on 9 October 2026 refused the sign-in below
        # three times running, so the pulls went unsigned and were refused too (ADR-051, Later, 9
        # October 2026). Docker's own setting sends a Docker Hub image to mirror.gcr.io, Google's copy
        # of Docker Hub, and falls back to Docker Hub when the mirror cannot answer. The Dockerfile
        # and the code keep Docker Hub's names, so Dependabot and a build by hand are as they were.
        run: |
          (sudo cat /etc/docker/daemon.json 2>/dev/null || echo '{}') \
            | jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' > "$RUNNER_TEMP/daemon.json"
          sudo cp "$RUNNER_TEMP/daemon.json" /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info --format 'Registry mirrors: {{.RegistryConfig.Mirrors}}'


      - name: Fetch the images the suite starts, through the mirror
        # Before the sign-in below, so they come from the mirror; one left off this list, or one that
        # fails here, is fetched by the suite itself, as before. The helper images `sv run` starts are read
        # from the one file that names them by fingerprint, as the code does (backlog 0317); the three after
        # them are the apps' own images, which the tests name by tag as an owner's manifest would.
        run: |
          for image in $(awk '/^FROM/ {print $2}' crates/sv-run/images/Dockerfile) \
                       busybox:1.36 node:22-alpine python:3.12-slim; do
            docker pull --quiet "$image" || echo "::warning::Could not fetch $image ahead of the suite; it will try."
          done

      # No cache step. The workspace builds its tests from scratch in about two minutes (126 s, measured for
      # backlog 0270), and each suite part builds them at once beside the others, so a cache would save about
      # that much waiting on a pull request. It would also be one more action in the job that is handed the
      # Docker Hub token; the workflow already pins GitHub's own upload-artifact and download-artifact, so the
      # cost is one more dependency there, not a new publisher. Whether that is worth it is the owner's call.
      - name: Use the toolchain this workspace needs
        # edition 2024 and resolver 3 need a recent stable; the runner image ships one, but saying so explicitly
        # means a runner image change fails here with a clear reason rather than a syntax error in a crate.
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable


      - name: Sign in to Docker Hub, fetch what the mirror missed, and sign out
        # The tests start containers from Docker Hub's images (the app's own, busybox, node, python). Signed out, every pull counts against Docker Hub's limit for the runner's shared
        # address, and on 9 October 2026 that limit ("429 Too Many Requests") turned main red for hours.
        # The owner's token (secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN, given 9 October
        # 2026), handed to this step alone; where the secrets are not given (a fork's pull request),
        # it says so and the pulls go unsigned, as before.
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::warning::No Docker Hub sign-in here; pulls are held to the anonymous limit."
          else
            # Three tries, then on without it: Docker Hub itself can fail a sign-in (a 500 on 9 October
            # 2026), and that is no reason to stop the run; the warning says the pulls went unsigned.
            signed_in=false
            for wait in 5 15 0; do
              if printf '%s' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin; then
                signed_in=true
                break
              fi
              sleep "$wait"
            done
            if [ "$signed_in" = true ]; then
              # Signed in only for these fetches, and signed out before anything of the branch's own
              # runs (backlog 0287): `docker login` keeps the token in ~/.docker/config.json, which a
              # test, a build script, or a package's own code could read as the same user.
              for image in $(awk '/^FROM/ {print $2}' crates/sv-run/images/Dockerfile) \
                           busybox:1.36 node:22-alpine python:3.12-slim; do
                docker image inspect "$image" > /dev/null 2>&1 \
                  || docker pull --quiet "$image" \
                  || echo "::warning::Could not fetch $image signed in; it will be fetched unsigned if needed."
              done
              docker logout
            else
              echo "::warning::Docker Hub refused the sign-in three times; pulls are held to the anonymous limit."
            fi
          fi


      - name: Tests
        # The fence tests need a container backend. GitHub's runners have Docker, so they run for real here;
        # where there is none they assert the honest-absence path instead and say which branch they took.
        # Every credit a check gives is written to this file (a debug build only; `Verified::new`), and
        # `test` below holds the findings-only lists in tools/coverage.py to what the four parts saw.
        # SV_REQUIRE_BACKEND makes Docker's absence a failure here (crates/sv-run/tests/fence.rs), so a
        # runner whose Docker broke turns this red rather than every fence test passing on the
        # no-backend path.
        env:
          SV_CREDIT_LOG: ${{ runner.temp }}/credits.log
          SV_REQUIRE_BACKEND: "1"
          PART: ${{ matrix.part }}
        # The archive tests read the 7z files they make with py7zr, a test-only package pinned to one version
        # (ADR-089); without it they fail, rather than passing without reading. They are in sv-check, so `check`.
        # py7zr and each package it pulls in are pinned to their files' hashes, so pip installs nothing it was
        # not told of (tools/py7zr-requirements.txt, backlog 0288).
        # Docker's own record of every container the tests create is kept while they run, and the images
        # they came from are listed at the end: which part starts which image is read from what happened,
        # not guessed from the tests' text (backlog 0363).
        run: |
          docker events --filter type=container --filter event=create \
            --format '{{.Actor.Attributes.image}}' > "$RUNNER_TEMP/started-images.txt" &
          watching=$!
          set +e
          (
            set -e
            case "$PART" in
              rest)
                cargo test --workspace --exclude sv-cli --exclude sv-check
                cargo test -p sv-cli --lib --bins
                cargo test -p sv-cli --doc
                ;;
              check)
                python3 -m pip install --require-hashes -r tools/py7zr-requirements.txt
                cargo test -p sv-check
                ;;
              cli-1) cargo test -p sv-cli $(python3 tools/ci_shards.py args 1 2) ;;
              cli-2) cargo test -p sv-cli $(python3 tools/ci_shards.py args 2 2) ;;
              *) echo "::error::no such part: $PART"; exit 1 ;;
            esac
          )
          status=$?
          kill "$watching" 2>/dev/null
          echo "Images the $PART tests started containers from, with how many containers:"
          sort "$RUNNER_TEMP/started-images.txt" | uniq -c | sort -rn
          exit "$status"

      - name: Pass the credits this part saw to `test`
        # GitHub's own artifact actions, pinned to a commit like every step here (ADR-106). Two files: the
        # credits, and beside them the census of what checks withheld (`finding::found`), which
        # tools/coverage.py reads with them. They hold only check names, requirement ids, and places in
        # sv's own code, no answer the app gave.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: credits-${{ matrix.part }}
          path: |
            ${{ runner.temp }}/credits.log
            ${{ runner.temp }}/credits.log.withheld
          if-no-files-found: error
          retention-days: 3

      - name: Sign out of Docker Hub
        if: always()
        run: docker logout

  test:
    # The check `main` requires (ADR-051). It always runs, and passes only when every job before it that
    # had to run passed: a part that failed, was canceled, or never ran fails it.
    needs: [scope, lints, suite]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: What the jobs before this said
        env:
          SCOPE: ${{ needs.scope.result }}
          FULL: ${{ needs.scope.outputs.full }}
          LINTS: ${{ needs.lints.result }}
          SUITE: ${{ needs.suite.result }}
        run: |
          echo "scope: $SCOPE (whole suite: $FULL), lints: $LINTS, suite: $SUITE"
          [ "$SCOPE" = success ] || { echo "::error::scope did not finish"; exit 1; }
          if [ "$FULL" != false ]; then
            [ "$LINTS" = success ] || { echo "::error::formatting or lints: $LINTS"; exit 1; }
            [ "$SUITE" = success ] || { echo "::error::the suite: $SUITE"; exit 1; }
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The token stays out of the checked-out folder, so nothing that runs later in the job
        # (a build script, a test, a package from outside) can read it. `sv check` reports this (AC.12.2).
        with:
          persist-credentials: false

      - name: Use the toolchain this workspace needs
        # edition 2024 and resolver 3 need a recent stable; the runner image ships one, but saying so explicitly
        # means a runner image change fails here with a clear reason rather than a syntax error in a crate.
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable


      - name: The tests that read the backlog, for a pull request that changes only backlog items
        # ADR-104: the backlog's own tool checks, the board, the docs pages built from every item, the
        # record numbers every document cites, the numbering tool that reads every item's number, and the
        # coordination board, whose check fails on an item it queues that a done note has finished (0421).
        # A new test that reads backlog items belongs here too. The whole suite runs again on main once
        # this merges (ADR-051).
        if: needs.scope.outputs.full == 'false'
        run: >-
          cargo test -p sv-cli --test backlog_board --test docs_page --test docs_page_tabs
          --test decision_records --test record_numbers --test ci_scope --test ci_shards
          --test coordination

      - name: The credits the four parts saw
        if: needs.scope.outputs.full != 'false'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: credits-*
          path: ${{ runner.temp }}/credits

      - name: What the suite saw credited
        if: needs.scope.outputs.full != 'false'
        # Fails when a check listed as only ever a finding was credited, or one never credited is not
        # listed. By 6 October 2026, 23 checks had been counted as crediting when none ever did. The four
        # parts' logs are read as one, credits and withheld each joined, and every part's two must be there.
        run: |
          for part in rest check cli-1 cli-2; do
            [ -s "$RUNNER_TEMP/credits/credits-$part/credits.log" ] || { echo "::error::no credit log from $part"; exit 1; }
            [ -f "$RUNNER_TEMP/credits/credits-$part/credits.log.withheld" ] || { echo "::error::no withheld log from $part"; exit 1; }
          done
          cat "$RUNNER_TEMP"/credits/credits-*/credits.log > "$RUNNER_TEMP/credits.log"
          cat "$RUNNER_TEMP"/credits/credits-*/credits.log.withheld > "$RUNNER_TEMP/credits.log.withheld"
          python3 tools/coverage.py --credits "$RUNNER_TEMP/credits.log"

  image:
    # The container for somebody who is not going to install Rust (the Dockerfile). Built from
    # scratch here, where Docker Hub is reachable, and driven over MCP the way an AI coding tool
    # would drive it: tools/image_smoke.py asserts the committed-secrets check really ran, in the
    # image and in a native sv, before comparing what the two found. The runner is an ordinary user,
    # so the file the image writes has to come out owned by that user, and a run as root over the
    # runner's folder is what shows `safe.directory` is needed. Built, not published.
    #
    # Skipped on the short path (backlog 0349): a pull request that changes only backlog items
    # changes nothing the image is built from, and this job took about four minutes and a round of
    # Docker Hub pulls on each one. A pull request that changes anything else, and every push and
    # nightly run on main, still builds and drives the image. `publish` needs this job and runs
    # only on a push to main, where the whole suite always runs, so it is unaffected.
    needs: scope
    if: needs.scope.outputs.full != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch Docker Hub's images through Google's mirror
        # Docker Hub refuses downloads past its limits, and on 9 October 2026 refused the sign-in below
        # three times running, so the pulls went unsigned and were refused too (ADR-051, Later, 9
        # October 2026). Docker's own setting sends a Docker Hub image to mirror.gcr.io, Google's copy
        # of Docker Hub, and falls back to Docker Hub when the mirror cannot answer. The Dockerfile
        # and the code keep Docker Hub's names, so Dependabot and a build by hand are as they were.
        run: |
          (sudo cat /etc/docker/daemon.json 2>/dev/null || echo '{}') \
            | jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' > "$RUNNER_TEMP/daemon.json"
          sudo cp "$RUNNER_TEMP/daemon.json" /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info --format 'Registry mirrors: {{.RegistryConfig.Mirrors}}'

      - name: Fetch the Dockerfile's base images before the build
        # Through the mirror, by their pinned fingerprints, so the build finds them here. Before the
        # sign-in below: signed in, the first try of this could not fetch them. A fetch that fails
        # warns and leaves the build to try for itself.
        run: |
          for image in $(awk '/^FROM/ {print $2}' Dockerfile); do
            docker pull "$image" || echo "::warning::Could not fetch $image ahead of the build; the build will try."
          done

      - name: Sign in to Docker Hub, fetch what the mirror missed, and sign out
        # The image is built from Docker Hub's `rust` and `debian` images. Signed out, every pull counts against Docker Hub's limit for the runner's shared
        # address, and on 9 October 2026 that limit ("429 Too Many Requests") turned main red for hours.
        # The owner's token (secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN, given 9 October
        # 2026), handed to this step alone; where the secrets are not given (a fork's pull request),
        # it says so and the pulls go unsigned, as before.
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::warning::No Docker Hub sign-in here; pulls are held to the anonymous limit."
          else
            # Three tries, then on without it: Docker Hub itself can fail a sign-in (a 500 on 9 October
            # 2026), and that is no reason to stop the run; the warning says the pulls went unsigned.
            signed_in=false
            for wait in 5 15 0; do
              if printf '%s' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin; then
                signed_in=true
                break
              fi
              sleep "$wait"
            done
            if [ "$signed_in" = true ]; then
              # Signed in only for these fetches, and signed out before anything of the branch's own
              # runs (backlog 0287): `docker login` keeps the token in ~/.docker/config.json, which a
              # test, a build script, or a package's own code could read as the same user.
              for image in $(awk '/^FROM/ {print $2}' Dockerfile); do
                docker image inspect "$image" > /dev/null 2>&1 \
                  || docker pull --quiet "$image" \
                  || echo "::warning::Could not fetch $image signed in; it will be fetched unsigned if needed."
              done
              docker logout
            else
              echo "::warning::Docker Hub refused the sign-in three times; pulls are held to the anonymous limit."
            fi
          fi

      - name: Build the image
        # The labels are the published image's: the source label ties the package to this repository
        # on GitHub, so it is listed there and takes its access from it. Built once, here; `publish`
        # pushes this same image, the one the steps below drive (backlog 0343, ADR-080).
        run: >
          docker build
          --label org.opencontainers.image.source=https://github.com/${{ github.repository }}
          --label org.opencontainers.image.revision=${{ github.sha }}
          --build-arg SV_GIT_COMMIT=${{ github.sha }}
          -t stackvet/sv .

      - name: Build sv natively, to compare with
        run: rustup toolchain install stable --profile minimal && rustup default stable && cargo build --release --locked -p sv-cli

      - name: Drive the image as an AI coding tool would
        run: python3 tools/image_smoke.py stackvet/sv --native target/release/sv --commit ${{ github.sha }}

      # The GitHub Action (action.yml, ADR-081), run as an app's workflow would run it, on the image just built:
      # one example app it should report on, and one folder with no stackvet.toml, where it should stop and say so.
      # Nothing is uploaded to code scanning from here; the report is kept with the run like any other.
      - name: Run the GitHub Action on an example app
        id: action
        uses: ./
        with:
          path: examples/flask-booking
          image: stackvet/sv
          upload-sarif: 'false'
          artifact-name: action-trial-report

      - name: Run the GitHub Action where there is no stackvet.toml
        id: no-manifest
        continue-on-error: true
        uses: ./
        with:
          path: docs
          image: stackvet/sv
          upload-sarif: 'false'
          artifact-name: action-trial-no-manifest

      - name: Check what the Action did
        env:
          CODE: ${{ steps.action.outputs.exit-code }}
          DIR: ${{ steps.action.outputs.report-dir }}
          NO_MANIFEST: ${{ steps.no-manifest.outcome }}
        run: |
          test "$CODE" = 0 || { echo "the example app's report exited $CODE"; exit 1; }
          for f in stackvet.sarif security.md report.json report.html; do
            test -s "$DIR/$f" || { echo "the Action wrote no $f"; exit 1; }
          done
          test "$NO_MANIFEST" = failure || { echo "the Action ran on a folder with no stackvet.toml"; exit 1; }

      - name: Keep the image the steps above drove, for publish
        # Only where `publish` runs, and only once every step above has passed on it. Compressed
        # here, so the upload does not compress it again.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save stackvet/sv | gzip -1 > "$RUNNER_TEMP/sv-image.tar.gz"

      - name: Hand it to publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sv-image
          path: ${{ runner.temp }}/sv-image.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Sign out of Docker Hub
        if: always()
        run: docker logout

  image-arm64:
    # The same image for arm64, built and driven on GitHub's own arm64 runner (backlog 0539, ADR-080):
    # an Apple Silicon Mac pulls this one, where the amd64 image warned that its platform did not
    # match on every start and ran under emulation. Built natively, not emulated: a Rust release
    # build under QEMU takes hours. The runner costs nothing for a public repository. Driven by
    # tools/image_smoke.py as `image` drives the amd64 one, against a native `sv` built on the same
    # runner, so what `publish` pushes for arm64 was tested too. The GitHub Action's trials stay with
    # `image`: they drive the same Dockerfile, and the Action runs on GitHub's amd64 runners.
    #
    # No Docker Hub sign-in here: the base images come through Google's mirror, as in `image`, and a
    # pull that the mirror misses goes to Docker Hub unsigned, as a fork's pull request does.
    needs: scope
    if: needs.scope.outputs.full != 'false'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch Docker Hub's images through Google's mirror
        run: |
          (sudo cat /etc/docker/daemon.json 2>/dev/null || echo '{}') \
            | jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' > "$RUNNER_TEMP/daemon.json"
          sudo cp "$RUNNER_TEMP/daemon.json" /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info --format 'Registry mirrors: {{.RegistryConfig.Mirrors}}'

      - name: Fetch the Dockerfile's base images before the build
        # Their pinned fingerprints name multi-platform indexes, so on this runner they are the arm64 images.
        run: |
          for image in $(awk '/^FROM/ {print $2}' Dockerfile); do
            docker pull "$image" || echo "::warning::Could not fetch $image ahead of the build; the build will try."
          done

      - name: Build the image
        # With the labels `image` gives the amd64 one, so the two are published alike.
        run: >
          docker build
          --label org.opencontainers.image.source=https://github.com/${{ github.repository }}
          --label org.opencontainers.image.revision=${{ github.sha }}
          --build-arg SV_GIT_COMMIT=${{ github.sha }}
          -t stackvet/sv .

      - name: The image is arm64
        run: |
          arch=$(docker image inspect --format '{{.Architecture}}' stackvet/sv)
          test "$arch" = arm64 || { echo "the image built here is $arch, not arm64"; exit 1; }

      - name: Build sv natively, to compare with
        # rustup is installed first where the runner's image has none.
        run: |
          if ! command -v rustup > /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal && rustup default stable && cargo build --release --locked -p sv-cli

      - name: Drive the image as an AI coding tool would
        run: python3 tools/image_smoke.py stackvet/sv --native target/release/sv --commit ${{ github.sha }}

      - name: Keep the image the steps above drove, for publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save stackvet/sv | gzip -1 > "$RUNNER_TEMP/sv-image-arm64.tar.gz"

      - name: Hand it to publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sv-image-arm64
          path: ${{ runner.temp }}/sv-image-arm64.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  publish:
    # Publishes the image to GitHub's container registry, at the owner's decision (26 September
    # 2026), as ghcr.io/abbyshade111/stackvet-sv: `latest`, and the commit it was built from. Only
    # for a push to main, and only once `test`, `image`, and `image-arm64` have passed on that same
    # commit. What it pushes is the images `image` and `image-arm64` built and drove, handed over as
    # artifacts and loaded here, not a second build of the same commit (backlog 0343): the digests
    # signed below are the tested images', and no time goes on building them again. The two are
    # published as one image for both platforms (backlog 0539). It is the one job that may write packages; every
    # other job keeps the read-only permission above. No third-party action: `docker login` with the
    # workflow's own token, which lasts for this run only.
    #
    # What it pushes is signed (ADR-080): GitHub's own action writes a statement of what built the
    # image (this repository, this workflow, this commit) for its digest, signed keylessly through
    # Sigstore with a certificate tied to this run, and pushes it beside the image. No key is kept.
    # Anybody can check it: `gh attestation verify oci://ghcr.io/abbyshade111/stackvet-sv:latest
    # --owner abbyshade111`.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, image, image-arm64]
    # The `publish` Environment, made by the owner in the repository's settings on 13 October 2026,
    # lets only runs of the branch `main` in (backlog 0289, 0422; ADR-051). GitHub holds that rule
    # outside this file, so no change to the `if:` above by a branch can get a pull request's run
    # into it.
    environment: publish
    # One publish at a time. A publish already going is never canceled; one waiting behind it is
    # replaced by a newer one, which only skips an image already out of date.
    concurrency:
      group: rust-publish-main
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      # For the signing only: a token to ask Sigstore for a certificate, and the right to keep the
      # signed statement with this repository's attestations.
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/abbyshade111/stackvet-sv
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the images that were tested
        # `image`'s for amd64 and `image-arm64`'s for arm64, into one folder: their files have different names.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sv-image*
          merge-multiple: true
          path: ${{ runner.temp }}

      - name: Load them under the names they are pushed as
        # Each under the commit and its platform; the commit's own tag and `latest` name the two together, below.
        # Both load as stackvet/sv, so each is tagged before the next is loaded.
        run: |
          for arch in amd64 arm64; do
            file="$RUNNER_TEMP/sv-image.tar.gz"
            [ "$arch" = arm64 ] && file="$RUNNER_TEMP/sv-image-arm64.tar.gz"
            gunzip -c "$file" | docker load
            got=$(docker image inspect --format '{{.Architecture}}' stackvet/sv)
            test "$got" = "$arch" || { echo "the $arch image is $got"; exit 1; }
            docker tag stackvet/sv "$IMAGE:${{ github.sha }}-$arch"
          done

      - name: Publish them, as one image for both platforms
        id: publish
        # Each platform's image is pushed under its own tag, then one manifest naming both is pushed as the
        # commit's tag (backlog 0539): `docker pull` picks the one for the machine it runs on. Runs on main can
        # finish out of order now that each commit has its own, so `latest` moves only when this commit is still
        # the newest on main. The token reaches the script through the environment, never as its text (backlog
        # 0318), as the Docker Hub steps' does.
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          sha="${{ github.sha }}"
          docker push "$IMAGE:$sha-amd64"
          docker push "$IMAGE:$sha-arm64"
          tags=(-t "$IMAGE:${{ github.sha }}")
          git fetch --depth=1 origin main
          if [ "$(git rev-parse FETCH_HEAD)" = "$sha" ]; then
            tags+=(-t "$IMAGE:latest")
          else
            echo "main has moved past $sha; latest is left to the newer commit's run"
          fi
          docker buildx imagetools create "${tags[@]}" "$IMAGE:$sha-amd64" "$IMAGE:$sha-arm64"
          digest_of() {
            docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -r .digest
          }
          echo "digest=$(digest_of "$IMAGE:$sha")" >> "$GITHUB_OUTPUT"
          echo "amd64=$(digest_of "$IMAGE:$sha-amd64")" >> "$GITHUB_OUTPUT"
          echo "arm64=$(digest_of "$IMAGE:$sha-arm64")" >> "$GITHUB_OUTPUT"
          # The one image names both platforms, and nothing else.
          platforms=$(docker buildx imagetools inspect "$IMAGE:$sha" --format '{{json .Manifest}}' \
            | jq -r '[.manifests[] | select(.platform.os == "linux") | .platform.architecture] | sort | join(",")')
          test "$platforms" = "amd64,arm64" || { echo "the published image names $platforms"; exit 1; }

      # Each signed (backlog 0539): the image both platforms share, which `gh attestation verify` checks for a tag,
      # and each platform's own, which is what `docker pull` fetches on that machine.
      - name: Sign what it was built from, and push that beside it
        # Still logged in: the signed statement is pushed to the registry with the same login.
        # No storage record: GitHub keeps those only for a repository an organization owns.
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Sign the amd64 image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.publish.outputs.amd64 }}
          push-to-registry: true
          create-storage-record: false

      - name: Sign the arm64 image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.publish.outputs.arm64 }}
          push-to-registry: true
          create-storage-record: false

      - name: Log out of the registry
        if: always()
        run: docker logout ghcr.io
