# stackvet.dev, checked each week against the repository it is built from (backlog 0702; ADR-132, Later, 22 November
# 2026). The site is built only when someone changes it, so a page can go stale while every test stays green: two
# reports shown on it were weeks old and a version behind on 21 November 2026, and nothing said so.
#
# Mondays at 10:00 UTC, after the other weekly checks (the long files at 09:00, the rulesets at 09:30), the owner's
# choice of 22 November 2026, and by hand from the Actions tab. It builds the site with its own test, as the deploy
# does, and runs the site's tests. When anything fails, or the build warns (a report it shows more than 30 days old,
# or made by an older `sv`), it says so in one issue, opened the first time and commented on after, so an unfixed
# warning keeps its history in one place. A run that only warns stays green; one that fails is red as well.
#
# It deploys nothing and reads no secret: its token reads the code and writes issues, nothing else. Every step is
# pinned to an exact commit fingerprint, as in rust.yml.

name: Site freshness

on:
  schedule:
    - cron: '0 10 * * 1' # Mondays, 10:00 UTC, after the rulesets run at 09:30.
  workflow_dispatch:

permissions:
  contents: read
  # To open or comment on the one issue that says what this run found.
  issues: write

concurrency:
  group: site-freshness
  cancel-in-progress: false

jobs:
  fresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The token stays out of the checked-out folder, so nothing that runs later can read it (AC.12.2).
        with:
          persist-credentials: false

      - name: Use the toolchain this workspace needs
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Build the site, with its own test, as the deploy does
        id: site
        run: |
          set +e
          {
            python3 -I tools/website.py --self-test && python3 -I tools/website.py --out "$RUNNER_TEMP/site"
          } > "$RUNNER_TEMP/site.log" 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/site.log"

      - name: The site's tests
        id: tests
        run: |
          set +e
          cargo test --locked -p sv-cli --test website --test website_fence_words --test website_example_report \
            --test website_configvet_install > "$RUNNER_TEMP/tests.log" 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          tail -n 60 "$RUNNER_TEMP/tests.log"

      - name: Say what was found, in one issue
        env:
          GH_TOKEN: ${{ github.token }}
          SITE: ${{ steps.site.outputs.status }}
          TESTS: ${{ steps.tests.outputs.status }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="stackvet.dev weekly freshness check"
          warnings=$(grep 'warning:' "$RUNNER_TEMP/site.log" || true)
          if [ "$SITE" = 0 ] && [ "$TESTS" = 0 ] && [ -z "$warnings" ]; then
            echo "The site built, its tests passed, and nothing it shows is stale."
            exit 0
          fi
          {
            echo "This week's check of stackvet.dev against the repository ($(date -u +%F)), [run]($RUN):"
            echo
            [ "$SITE" = 0 ] || { echo "**The site did not build.** Its last lines:"; echo '```'; tail -n 20 "$RUNNER_TEMP/site.log"; echo '```'; }
            [ "$TESTS" = 0 ] || { echo "**The site's tests failed.** Their last lines:"; echo '```'; { grep -E 'panicked|FAILED|^test result' "$RUNNER_TEMP/tests.log" || tail -n 30 "$RUNNER_TEMP/tests.log"; } | tail -n 30; echo '```'; }
            [ -z "$warnings" ] || { echo "**Stale:**"; echo "$warnings" | sed 's/^tools\/website.py: warning: /- /'; }
            echo
            echo "Nothing was deployed. Fix it in the repository, then run the site deploy (.github/workflows/site.yml)."
          } > "$RUNNER_TEMP/issue.md"
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" \
            --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$RUNNER_TEMP/issue.md"
          fi
          # Warnings alone keep the run green; a build or a test that failed makes it red as well.
          [ "$SITE" = 0 ] && [ "$TESTS" = 0 ]
