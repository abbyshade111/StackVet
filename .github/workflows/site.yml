# stackvet.dev: builds the site from the repository with tools/website.py and publishes it to Cloudflare (backlog
# 0376; ADR-132, Later). It publishes only when the owner starts it, from the Actions tab: nothing on a push or a
# schedule publishes, so the first run is the site going live, at the owner's word. On a pull request that changes
# the site or its deploy, the check job alone runs: it builds the site and has wrangler read the deploy without
# publishing (--dry-run), with no secret.
#
# What it publishes is exports/site/ as tools/website.py builds it at the commit the run is started from: the
# pages, the report files they link to, the walk-through's screens, and _headers, the response headers Cloudflare
# sends with every page. deploy/stackvet.dev/wrangler.jsonc says where. The token and the account are the owner's,
# in the repository's secrets, and reach only the deploy step, through its inputs.
#
# Every step is pinned to an exact commit fingerprint, as in rust.yml, and wrangler to an exact version.

name: Site

on:
  workflow_dispatch:
  pull_request:
    paths: ['tools/website.py', 'tools/framework_pages.py', 'docs/website/**', 'deploy/stackvet.dev/**',
            '.github/workflows/site.yml']

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the site's script
        run: python3 -I tools/website.py --self-test

      - name: Build the site
        run: python3 -I tools/website.py

      - name: Read the deploy without publishing
        # No token and no account: --dry-run reads the configuration and the files it would upload, and stops.
        run: npx --yes wrangler@4.148.0 deploy --dry-run --config deploy/stackvet.dev/wrangler.jsonc

  deploy:
    needs: check
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the site
        run: python3 -I tools/website.py

      - name: Publish it to Cloudflare
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.148.0'
          command: deploy --config deploy/stackvet.dev/wrangler.jsonc

      - name: Check that stackvet.dev serves the site with its headers
        # The first deploy makes the address's record and certificate, which can take a few minutes to answer.
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --head https://stackvet.dev/ -o /dev/null -D "$RUNNER_TEMP/headers"; then
              if grep -qi '^content-security-policy:' "$RUNNER_TEMP/headers"; then
                echo "stackvet.dev answers, with its content security policy."
                exit 0
              fi
              echo "stackvet.dev answers, but without its content security policy."
              cat "$RUNNER_TEMP/headers"
              exit 1
            fi
            sleep 30
          done
          echo "stackvet.dev did not answer within ten minutes of the deploy."
          exit 1
