# The Windows program of `sv`, published as a GitHub Release when the owner pushes a version tag (backlog 0120 step 2,
# ADR-108). Homebrew builds `sv` from source on Mac and Linux, and the container image runs anywhere Docker does; this
# is the program a Scoop install on Windows downloads (the bucket abbyshade111/scoop-stackvet).
#
# On a tag `v*`: built on a Windows runner, checked to start and to find its data beside it, zipped with that data and
# the licence, and handed to a second job that signs it (GitHub's keyless signing, the step the image's publishing
# uses, so anyone can check it with `gh attestation verify`) and attaches it with its SHA-256 to the release of that
# tag. The tag must match the version `sv` reports. Run by hand, or on a pull request that changes this file: the
# first job alone, kept as the run's file, with nothing published or signed, so the workflow can be tried before a
# tag. Only the second job can write anything, and it runs inside the `release` Environment, which the owner made in
# the repository's settings on 13 October 2026 to admit only runs of tags `v*` (backlog 0422): GitHub holds that rule
# outside this file, so no edit to it by a branch can sign or publish from a pull request.
#
# Every step is pinned to an exact commit fingerprint rather than a version name, as in the other workflows.

name: Release

on:
  push:
    tags: ["v*"]
  # Also on a pull request that changes this file, as a trial: built, zipped, and checked, nothing published or
  # signed, so a change to it is seen working before a tag ever runs it.
  pull_request:
    paths: [.github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    # The build and its check, with no permission to write anything: the job a pull request runs.
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    outputs:
      name: ${{ steps.zip.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The token stays out of the checked-out folder (AC.12.2).
        with:
          persist-credentials: false

      - name: Use the toolchain this workspace needs
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: The tag is the version sv reports
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          echo "Cargo.toml says $version; the tag is $TAG"
          [ "$TAG" = "v$version" ] || { echo "::error::the tag $TAG is not v$version, the version in Cargo.toml"; exit 1; }

      - name: Build sv
        run: cargo build --release --locked -p sv-cli

      - name: The zip, with the data beside the program
        id: zip
        env:
          TAG: ${{ github.ref_name }}
        run: |
          name="sv-${TAG#v}-windows-x86_64"
          [ "${{ github.event_name }}" = push ] || name="sv-trial-windows-x86_64"
          mkdir -p "dist/$name"
          cp target/release/sv.exe "dist/$name/"
          cp -r data "dist/$name/data"
          cp LICENSE "dist/$name/"
          (cd dist && 7z a -tzip "$name.zip" "$name" > /dev/null)
          (cd dist && sha256sum "$name.zip" > "$name.zip.sha256")
          cat "dist/$name.zip.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: The zipped program starts and finds its own data
        # Unzipped somewhere else, with the checkout's data moved away, so the program can only be reading the data
        # beside it (ADR-036): the folder a Scoop install leaves.
        env:
          NAME: ${{ steps.zip.outputs.name }}
        run: |
          mkdir -p "$RUNNER_TEMP/try"
          (cd "$RUNNER_TEMP/try" && 7z x "$GITHUB_WORKSPACE/dist/$NAME.zip" > /dev/null)
          mv data data.moved
          sv="$RUNNER_TEMP/try/$NAME/sv.exe"
          "$sv" --version
          "$sv" check examples/flask-booking > check.txt 2>&1 || true
          head -40 check.txt
          grep -q "Read " check.txt || { echo "::error::the zipped sv did not read the example app"; mv data.moved data; exit 1; }
          mv data.moved data

      - name: Keep the zip for the release job, or as the trial's file
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.zip.outputs.name }}
          path: |
            dist/${{ steps.zip.outputs.name }}.zip
            dist/${{ steps.zip.outputs.name }}.zip.sha256
          retention-days: 3

  release:
    # Signs the zip the job above built and checked, and makes the release: only on a tag, and only inside the
    # `release` Environment (tags `v*`), the one job of this workflow that may write. What it signs is the tested
    # zip handed over as an artifact, as the image's `publish` job takes the tested image (backlog 0343).
    if: github.event_name == 'push'
    needs: windows
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # The release, and the signed statement of where the zip was built (as the image's publishing has).
      contents: write
      id-token: write
      attestations: write
    env:
      NAME: ${{ needs.windows.outputs.name }}
    steps:
      - name: Fetch the zip that was checked
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.windows.outputs.name }}
          path: dist

      - name: Sign the zip that was checked
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ needs.windows.outputs.name }}.zip

      - name: The release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" "dist/$NAME.zip" "dist/$NAME.zip.sha256" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "sv $TAG" \
            --notes "The Windows program of sv $TAG, zipped with its data. On Windows, install it with Scoop (see docs/GETTING-STARTED.md), or unzip it and run sv.exe from that folder. Check where it was built with: gh attestation verify $NAME.zip --repo $GITHUB_REPOSITORY. Mac and Linux: Homebrew, or the container image."
