# A small notes service in Rust, written for StackVet's tests to read, never to be built or run (backlog 0649). Each
# fault a Rust rule looks for sits beside its safe form, marked `// sv:fault <rule>` and `// sv:safe <rule>`.
[package]
name = "rust-notes"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
rusqlite = "0.31"
md5 = "0.7"
sha1 = "0.10"
sha2 = "0.10"
tera = "1"
hmac = "0.12"
html-escape = "0.2"
pbkdf2 = "0.12"
openssl = "0.10"
jsonwebtoken = "9"
reqwest = "0.12"
tokio-tungstenite = "0.21"
tower-http = { version = "0.5", features = ["cors", "fs"] }
