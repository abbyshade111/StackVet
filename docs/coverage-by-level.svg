<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 934 210" width="934" height="210" role="img" aria-labelledby="t d" font-family="Atkinson Hyperlegible, -apple-system, Segoe UI, sans-serif">
<title id="t">ASVS 5.0 by level: what a check can reach</title>
<desc id="d">Level 1: 70 requirements, 46 can be credited, 14 can only be found failing, 3 a check helps, a person decides, 4 the owner answers, 3 no check yet; Level 2: 183 requirements, 82 can be credited, 39 can only be found failing, 7 a check helps, a person decides, 51 the owner answers, 4 no check yet; Level 3: 92 requirements, 12 can be credited, 12 can only be found failing, 1 a check helps, a person decides, 44 the owner answers, 23 no check yet. The same counts are the table in docs/COVERAGE.md.</desc>
