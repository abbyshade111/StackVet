<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="900" height="900" role="img" aria-labelledby="t d">
<title id="t">The software development lifecycle</title>
<desc id="d">A ring of six phases in order: 1, Planning, 2, Analysis, 3, Design, 4, Implementation, 5, Testing &amp; Integration, 6, Maintenance. Each points to the next, and Maintenance leads back to Planning.</desc>
<rect width="900" height="900" fill="#EEF0EA"/>
<text x="48.0" y="70.0" font-family="'Atkinson Hyperlegible', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" fill="#14201C" font-weight="bold" text-anchor="start">The software development lifecycle</text>
<text x="48.0" y="104.0" font-family="'Atkinson Hyperlegible', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#3B4842" font-weight="normal" text-anchor="start">Six phases, repeated for each change: Maintenance leads back to Planning.</text>
