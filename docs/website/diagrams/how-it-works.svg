<svg xmlns="http://www.w3.org/2000/svg" width="1116" height="496" viewBox="0 0 1116 496" role="img" aria-labelledby="title desc" font-family="Atkinson Hyperlegible, Verdana, Arial, sans-serif">
<title id="title">How StackVet works</title>
<desc id="desc">Three lanes, you, your AI coding tool, and sv, across five steps. 1, plan: you describe the app; your AI coding tool writes stackvet.toml with you; sv works out which requirements apply. 2, build: the tool writes the code, a feature at a time. 3, check: after each feature the tool calls stackvet_check; sv reads the code and says first what it did not examine; the tool fixes what it finds. 4, questions: the tool asks you the questions only you can answer and writes them down as its own word; you answer and record your answers with sv review. 5, report: you run sv report --run at a terminal; sv starts the app behind its fence and writes the report folder, and you read report.html.</desc>
