seal = "v3:ede3386f148f7505:"

[[finding-review]]
rule = "semgrep.typescript.react.security.react-insecure-request.react-insecure-request"
file = "crates/sv-run/assets/browser-driver.mjs"
fingerprint = "v2-e3e6add3149d8ed7"
verdict = "false-alarm"
why = "Not React: the browser driver runs in Node inside the fenced network and asks the headless browser's own DevTools port, on the same network, for its version over plain HTTP, as DevTools only offers. No user data travels and nothing leaves the fence."
by = "owner"
on = "2026-10-23"
seal = "v3:ede3386f148f7505:"

[[finding-review]]
rule = "ast.unauthenticated-encryption"
file = "crates/sv-check/src/ssh_format.rs"
fingerprint = "v2-960fa456a8e584c0"
verdict = "false-alarm"
why = "This locks and unlocks `sv review`'s own Ed25519 signing key in the format `ssh-keygen` writes (bcrypt-pbkdf, then AES-256-CTR, from OpenSSH's PROTOCOL.key), so `ssh-keygen` can read the key and check its seals. The format is OpenSSH's and has no tag of its own, but a changed file or a wrong passphrase is refused: the unlocked private part must be the key the public part names (line 327)."
by = "owner"
on = "2026-10-23"
seal = "v3:ede3386f148f7505:"

[[finding-review]]
rule = "ast.weak-hash-function"
file = "crates/sv-check/src/git.rs"
fingerprint = "v2-8e9fea3a655e6a84"
verdict = "false-alarm"
why = "This computes git's object names, which git defines as the SHA-1 (or, in a SHA-256 repository, the SHA-256) of the object's header and content, to find a file's blob in the repository. It is an identifier git chose, not a protection: nothing is signed, stored as a secret, or trusted because of it."
by = "owner"
on = "2026-10-23"
seal = "v3:ede3386f148f7505:"

[[finding-review]]
rule = "ast.weak-key-generation"
file = "crates/sv-check/src/weak_keys.rs"
fingerprint = "v2-89615f4064a463be"
verdict = "false-alarm"
why = "The weak-key check's own pattern for a 192-bit curve (`secp192r1`, `prime192v1`, `P-192`), a regular expression it matches against other apps' code. No key is made here; the curve's name is the text the check looks for."
by = "owner"
on = "2026-10-23"
seal = "v3:ede3386f148f7505:"

