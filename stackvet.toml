fingerprint = "v2-789e8ddd626edc20"
verdict = "false-alarm"
why = "A list of passwords published in known breaches, kept as data so the breached-password check can try them against the app under test and see them refused (V6.2.12). They are public by definition, belong to no account of StackVet's, and the file exists to hold exactly such values."
by = "owner"
